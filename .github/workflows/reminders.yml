name: STK / vignette reminders

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  check-reminders:
    runs-on: ubuntu-latest
    steps:
      - name: Call reminder endpoint
        run: |
          curl -sf -X POST "${{ secrets.BACKEND_URL }}/api/vehicles/check-reminders" \
            -H "x-reminder-secret: ${{ secrets.REMINDER_SECRET }}"
